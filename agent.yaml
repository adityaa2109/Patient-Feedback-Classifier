spec_version: "0.1.0"
name: expense-approval-agent
version: "1.0.0"
description: >
  A finance-policy agent that reviews a single employee expense claim and
  decides whether to approve it, reject it, or route it to a human. It checks
  the claim against fixed company rules: prohibited categories, missing
  receipts, duplicate claims, per-category limits, and a monthly spending cap
  per employee. Every decision names the exact rules that triggered it, so a
  reviewer can see why a claim was approved, rejected, or escalated.
