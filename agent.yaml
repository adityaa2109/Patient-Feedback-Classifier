spec_version: "0.1.0"
name: support-ticket-router-agent
version: "1.0.0"
description: >
  A customer-support triage agent that reads a ticket and decides which queue
  it belongs in, how urgent it is, and how quickly it must be answered. It
  scores the ticket against fixed keyword rules for billing, technical,
  account, and security problems, raises urgency for outages, premium
  customers, and repeat contacts, and sends anything sensitive or unclear to
  a human instead of guessing. Every routing decision lists the rules that
  produced it.
