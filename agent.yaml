spec_version: "0.1.0"
name: code-review-checker-agent
version: "1.0.0"
description: >
  A code-review assistant that reads a unified diff and flags risky changes
  using fixed, explainable rules: hardcoded secrets, dangerous function
  calls, bare exception handlers, skipped tests, debug leftovers, source
  changes without test changes, oversized changes, and edits to sensitive
  files such as CI workflows. It returns a verdict of approve,
  request changes, or needs a human reviewer, with every finding tied to a
  rule, a file, and a line number. It never prints the value of a suspected
  secret.
